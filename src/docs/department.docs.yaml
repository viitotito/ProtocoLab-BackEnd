paths:
  /api/departments:
    get:
      summary: Lists the company's departments
      tags:
        - Departments
      
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      security:
        - bearerAuth: []

      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"

        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

    post:
      summary: Creates a department
      tags:
        - Departments

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                  example: IT

                description:
                  type: string
                  example: Information Technology

      responses:
        "201":
          description: Department successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

        "400":
          description: Validation error

        "403":
          description: No permission

  /api/departments/{id}:
    get:
      summary: Search for a department by ID
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Department found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

        "404":
          description: Department not found

    patch:
      summary: Updates department
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string

      responses:
        "200":
          description: Department successfully updated

        "400":
          description: Validation error

        "404":
          description: Department not found

    delete:
      summary: Remove department
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Department successfully removed

        "400":
          description: It is not possible to remove (existing links)

        "404":
          description: Department not found
