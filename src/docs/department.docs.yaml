paths:
  /api/departments:
    get:
      summary: Lists the company's departments.
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    description:
                      type: string
                    _count:
                      type: object
                      properties:
                        users:
                          type: integer
                        tickets:
                          type: integer

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

    post:
      summary: Creates a department.
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                  example: IT

                description:
                  type: string
                  example: Information Technology

      responses:
        "201":
          description: Department successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Department successfully created
                  data:
                    $ref: "#/components/schemas/Department"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "403":
          description: No permission

  /api/departments/{id}/users:
    get:
      summary: List users by department.
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Department ID

      responses:
        "200":
          description: Users from the department
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    email:
                      type: string
                    role:
                      type: string

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: Department not found

  /api/departments/{id}:
    get:
      summary: Search for a department by ID.
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Department ID

      responses:
        "200":
          description: Department found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  companyId:
                    type: integer
                  users:
                    type: array
                    items:
                      type: object
                  tickets:
                    type: array
                    items:
                      type: object

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: Department not found

    patch:
      summary: Updates department.
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Department ID

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string

      responses:
        "200":
          description: Department successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Department successfully updated
                  data:
                    $ref: "#/components/schemas/Department"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: Department not found

    delete:
      summary: Remove department.
      tags:
        - Departments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Department ID

      responses:
        "200":
          description: Department successfully removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: Department not found