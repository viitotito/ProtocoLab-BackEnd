paths:
  /api/tickets/{id}/assignees:
    post:
      summary: Assigns a collaborator to the ticket.
      tags:
        - Tickets Assignments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ticket ID

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  example: 5

      responses:
        "201":
          description: Collaborator successfully assigned to the ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketId:
                    type: integer
                    example: 1

                  userId:
                    type: integer
                    example: 5

                  user:
                    $ref: "#/components/schemas/User"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "403":
          description: No permission

        "404":
          description: Ticket or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

    get:
      summary: Lists the employees assigned to the ticket.
      tags:
        - Tickets Assignments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ticket ID

      responses:
        "200":
          description: List of staff members assigned to the ticket
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/tickets/{id}/assignees/{userId}:
    delete:
      summary: Removes a collaborator from the ticket.
      tags:
        - Tickets Assignments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ticket ID

        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: User ID

      responses:
        "200":
          description: Collaborator removed from the ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "403":
          description: No permission

        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"