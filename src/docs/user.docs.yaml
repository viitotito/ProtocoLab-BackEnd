paths:
  /api/users:
    get:
      summary: Retorna os usuários cadastrados
      tags:
        - Users

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Lista de usuários cadastrados na empresa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

        "401":
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"