paths:
  /api/users:
    get:
      summary: Lists company users.
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

    post:
      summary: Creates a new user.
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
                - departmentId
              properties:
                name:
                  type: string
                  example: John Doe

                email:
                  type: string
                  format: email
                  example: john@email.com

                password:
                  type: string
                  example: password123

                role:
                  type: string
                  example: Admin

                departmentId:
                  type: integer
                  example: 1

      responses:
        "201":
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User successfully created

                  user:
                    $ref: "#/components/schemas/User"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "403":
          description: No permission

  /api/users/{id}:
    get:
      summary: Search for user by ID.
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID

      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer

                  name:
                    type: string

                  email:
                    type: string

                  role:
                    type: string

                  departmentId:
                    type: integer

                  department:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

    patch:
      summary: Update user information.
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Jane Doe

                email:
                  type: string
                  format: email
                  example: jane@email.com

                password:
                  type: string
                  example: password123

                role:
                  type: string
                  example: Admin

                departmentId:
                  type: integer
                  example: 1

      responses:
        "200":
          description: User successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User successfully updated

                  user:
                    $ref: "#/components/schemas/User"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

    delete:
      summary: Remove user.
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID

      responses:
        "200":
          description: User successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"