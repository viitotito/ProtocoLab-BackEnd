paths:
  /api/users:
    get:
      summary: Lists company users.
      tags:
        - Users

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      security:
        - bearerAuth: []

      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

    post:
      summary: Creates a new user (admin only).
      tags:
        - Users

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
                - departmentId
              properties:
                name:
                  type: string
                  example: John Doe

                email:
                  type: string
                  example: jhond@email.com

                password:
                  type: string
                  example: senha123

                role:
                  type: string
                  example: Admin

                departmentId:
                  type: integer
                  example: 1

      responses:
        "201":
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "403":
          description: No permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

  /api/users/{id}:
    get:
      summary: Search for user by ID.
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "404":
          description: User not found

    patch:
      summary: Update user information
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Jane Doe

                email:
                  type: string
                  example: janed@email.com

                password:
                  type: string
                  example: senha123

                role:
                  type: string
                  example: Admin

                departmentId:
                  type: integer
                  example: 1

      responses:
        "200":
          description: User successfully updated

        "400":
          description: Validation error

    delete:
      summary: Remove user.
      tags:
        - Users

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: User successfully deleted

        "404":
          description: User not found