paths:
  /api/tickets:
    get:
      summary: Lists all of the company's support tickets.
      tags:
        - Tickets

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      security:
        - bearerAuth: []

      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

    post:
      summary: Create a new ticket.
      tags:
        - Tickets

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - departmentId
              properties:
                title:
                  type: string
                  example: Computer won't turn on

                description:
                  type: string
                  example: The computer does not start after pressing the power button

                departmentId:
                  type: integer
                  example: 2

                priority:
                  type: string
                  enum:
                    - HIGH
                    - NORMAL
                    - LOW
                  example: HIGH

      responses:
        "201":
          description: Ticket successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

        "400":
          description: Validation error or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

  /api/tickets/{id}:
    get:
      summary: Search for a ticket by ID.
      tags:
        - Tickets    

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Ticket found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

    patch:
      summary: Updates a ticket.
      tags:
        - Tickets

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Computer won't turn on

                description:
                  type: string
                  example: The computer still won't turn on

                status:
                  type: string
                  enum:
                    - OPEN
                    - IN_PROGRESS
                    - CLOSED
                  example: IN_PROGRESS

                priority:
                  type: string
                  enum:
                    - HIGH
                    - NORMAL
                    - LOW
                  example: NORMAL

                departmentId:
                  type: integer
                  example: 2

      responses:
        "200":
          description: Ticket successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

    delete:
      summary: Removes a ticket.
      tags:
        - Tickets

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Ticket successfully removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

        "403":
          description: No permission to delete tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
