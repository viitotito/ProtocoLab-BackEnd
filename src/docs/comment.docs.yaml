paths:
  /api/tickets/{id}/comments:
    post:
      summary: Add a comment to the ticket
      tags:
        - Comments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ticket ID

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  type: string
                  example: The problem is still occurring

      responses:
        "201":
          description: Comment successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  description:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string

        "400":
          description: Validation error or business rule

        "401":
          description: Not authenticated

        "404":
          description: Ticket not found


    get:
      summary: List ticket comments
      tags:
        - Comments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ticket ID

      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    description:
                      type: string
                    user:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string

        "404":
          description: Ticket not found


  /api/tickets/{id}/comments/{commentId}:
    patch:
      summary: Update comment
      tags:
        - Comments

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ticket ID

        - in: path
          name: commentId
          required: true
          schema:
            type: integer
          description: Comment ID

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  type: string
                  example: Updating comment after verification

      responses:
        "200":
          description: Comment successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  description:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string

        "400":
          description: Validation error

        "403":
          description: No permission to edit

        "404":
          description: Comment not found


    delete:
      summary: Delete comment
      tags:
        - Comments
        
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ticket ID

        - in: path
          name: commentId
          required: true
          schema:
            type: integer
          description: Comment ID

      responses:
        "200":
          description: Comment successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comment successfully deleted

        "403":
          description: No permission to delete

        "404":
          description: Comment not found