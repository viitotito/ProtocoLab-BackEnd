paths:
  /api/auth/register:
    post:
      summary: Creates a company and the first user (Admin).
      tags:
        - Auth

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyName
                - companyEmail
                - cnpj
                - employeeName
                - password
                - confirmPassword
              properties:
                companyName:
                  type: string
                  example: ProtocoLab
                companyEmail:
                  type: string
                  format: email
                  example: admin@protocolab.com
                cnpj:
                  type: string
                  example: "12345678000199"
                employeeName:
                  type: string
                  example: Admin
                password:
                  type: string
                  example: admin123
                confirmPassword:
                  type: string
                  example: admin123

      responses:
        "201":
          description: Company registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Company registered successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Admin
                      email:
                        type: string
                        example: admin@protocolab.com
                      role:
                        type: string
                        example: Admin
                      company:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: ProtocoLab

        "400":
          description: Validation error or business rule violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/auth/login:
    post:
      summary: Logs the user in.
      tags:
        - Auth

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyEmail
                - employeeName
                - password
              properties:
                companyEmail:
                  type: string
                  format: email
                  example: admin@protocolab.com
                employeeName:
                  type: string
                  example: Admin
                password:
                  type: string
                  example: admin123

      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User logged in successfully
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIs...
                  user:
                    $ref: "#/components/schemas/User"

        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

  /api/auth/refresh:
    post:
      summary: Generates a new Access Token using the Refresh Token stored in the HttpOnly cookie.
      tags:
        - Auth

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      responses:
        "200":
          description: Token successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token successfully updated
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIs...

        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

  /api/auth/me:
    get:
      summary: Returns the authenticated user's data.
      tags:
        - Auth

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Authenticated user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"

        "404":
          description: User not found

  /api/auth/logout:
    post:
      summary: Logs out the authenticated user.
      tags:
        - Auth

      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        
      security:
        - bearerAuth: []

      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

        "401":
          description: Invalid token or unauthenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
