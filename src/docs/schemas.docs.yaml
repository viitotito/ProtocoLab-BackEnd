components:
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation error.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Unauthorized:
      type: object
      properties:
        message:
          type: string
          example: Invalid or expired access token.

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: Admin

        email:
          type: string
          example: admin@protocolab.com

        role:
          type: string
          example: Admin

        companyId:
          type: integer
          example: 1

        departmentId:
          type: integer
          example: 1

    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: IT

        description:
          type: string
          example: Information Technology.

        companyId:
          type: integer
          example: 1

    Ticket:
      type: object
      properties:
        id:
          type: integer
          example: 1

        title:
          type: string
          example: Computer won't turn on

        description:
          type: string
          example: The computer won't turn on.

        status:
          type: string
          enum: [OPEN, IN_PROGRESS, CLOSED]

        priority:
          type: string
          enum: [HIGH, NORMAL, LOW]

        opening:
          type: string
          format: date-time

        completion:
          type: string
          format: date-time
          nullable: true

    TicketList:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            department:
              type: object

            owner:
              type: object

            _count:
              type: object

    TicketDetails:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            department:
              type: object

            owner:
              $ref: "#/components/schemas/User"

            assignees:
              type: array
              items:
                $ref: "#/components/schemas/User"

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - pt-BR
          - en-US
          - es-ES
        default: pt-BR
      description: Language selector