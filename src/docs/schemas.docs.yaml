components:
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Erro de validação.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Unauthorized:
      type: object
      properties:
        message:
          type: string
          example: Token de acesso inválido ou expirado.

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: Admin

        email:
          type: string
          example: admin@protocolab.com

        role:
          type: string
          example: Admin

        companyId:
          type: integer
          example: 1

        departmentId:
          type: integer
          example: 1

    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: TI

        description:
          type: string
          example: Tecnologia da informação.

        companyId:
          type: integer
          example: 1

    Ticket:
      type: object
      properties:
        id:
          type: integer
          example: 1

        title:
          type: string
          example: Computador não liga

        description:
          type: string
          example: O computador não inicia.

        status:
          type: string
          enum:
            - OPEN
            - IN_PROGRESS
            - CLOSED
          example: OPEN

        priority:
          type: string
          enum:
            - HIGH
            - NORMAL
            - LOW
          example: NORMAL

        opening:
          type: string
          format: date-time

        completion:
          type: string
          format: date-time
          nullable: true

    TicketList:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            department:
              type: object
              properties:
                id:
                  type: integer
                  example: 2

                name:
                  type: string
                  example: TI

            owner:
              type: object
              properties:
                id:
                  type: integer
                  example: 1

                name:
                  type: string
                  example: João Silva

            _count:
              type: object
              properties:
                assignees:
                  type: integer
                  example: 3

                comments:
                  type: integer
                  example: 5

    TicketDetails:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            department:
              type: object
              properties:
                id:
                  type: integer
                  example: 2

                name:
                  type: string
                  example: TI

            owner:
              $ref: "#/components/schemas/User"

            assignees:
              type: array
              items:
                $ref: "#/components/schemas/User"