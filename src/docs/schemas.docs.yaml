components:
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Erro de validação.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Unauthorized:
      type: object
      properties:
        message:
          type: string
          example: Token de acesso inválido ou expirado.

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: Admin

        email:
          type: string
          example: admin@protocolab.com

        role:
          type: string
          example: Admin

        companyId:
          type: integer
          example: 1

        departmentId:
          type: integer
          example: 1

    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: TI

        description:
          type: string
          example: Tecnologia da informação.

        companyId:
          type: integer
          example: 1

    Ticket:
      type: object
      properties:
        id:
          type: integer
          example: 1

        title:
          type: string
          example: Computador não liga

        description:
          type: string
          example: O computador não inicia após pressionar o botão de ligar.

        status:
          type: string
          example: OPEN

        opening:
          type: string
          format: date-time
          example: "2026-06-29T15:30:00.000Z"

        completion:
          type: string
          format: date-time
          nullable: true
          example: null

        owner:
          type: object
          properties:
            id:
              type: integer
              example: 1

            name:
              type: string
              example: João Silva

            email:
              type: string
              example: joao@empresa.com

        department:
          type: object
          properties:
            id:
              type: integer
              example: 2

            name:
              type: string
              example: TI